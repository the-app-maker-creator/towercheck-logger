plugins {
    id 'com.android.application'
}

android {
    namespace 'nz.towercheck.logger'
    compileSdk 34

    defaultConfig {
        applicationId 'nz.towercheck.logger'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // Fixed signing key kept in the repo so every build can update the last one.
    signingConfigs {
        fixed {
            storeFile file('towercheck.keystore')
            storePassword 'towercheck'
            keyAlias 'towercheck'
            keyPassword 'towercheck'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
