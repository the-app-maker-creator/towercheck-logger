plugins {
    id 'com.android.application'
}

android {
    namespace 'nz.towercheck.logger'
    compileSdk 34

    defaultConfig {
        applicationId 'nz.towercheck.logger'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
